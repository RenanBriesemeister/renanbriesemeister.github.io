<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERBUM · Palavra do Dia</title>
<meta name="description" content="VERBUM: jogo de palavras em português com desafios diários, rankings e dicionário colecionável.">
<style>
  :root {
    --fundo: #f7f0e1;
    --cartao: #fffaf0;
    --texto: #3d3427;
    --secundario: #7a6d5a;
    --verde: #5a9e3a;
    --borda: #e6dcc6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; letter-spacing: 4px; }
  p { margin: 0 0 20px; color: var(--secundario); line-height: 1.5; }
  a.botao {
    display: block;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    background: var(--verde);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  a.botao.sec { background: transparent; color: var(--verde); border: 1px solid var(--verde); }
  footer { margin-top: 20px; font-size: 14px; }
  footer a { color: var(--secundario); }
</style>
</head>
<body>
<main>
  <h1>VERBUM</h1>
  <p>Descubra a palavra do dia. Desafios diários em português, rankings e um dicionário para colecionar.</p>
  <a class="botao" href="https://play.google.com/store/apps/details?id=com.renan.verbum">Baixar no Google Play</a>
  <a class="botao sec" href="https://www.instagram.com/verbum_game/">Siga no Instagram</a>
  <footer><a href="/Verbum/privacidade.html">Política de privacidade</a></footer>
</main>
</body>
</html>
